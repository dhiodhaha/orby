[package]
name = "app-store"
version = "0.1.0"
edition = "2021"
description = "Local-first task store: SQLite copy, hybrid logical clock, per-field last-writer-wins merge, outbox for sync."
license = "Apache-2.0"
publish = false

# Its own workspace until the app owner adds it to the root one.

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
