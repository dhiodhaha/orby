[package]
name = "app-disk"
version = "0.1.0"
edition = "2021"
description = "Disk scanner (Arbor): multi-threaded walk into an arena tree, size queries, safe-to-clean candidates, Recycle Bin moves."
license = "Apache-2.0"
publish = false


[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Pure Rust BLAKE3 on macOS: the default build compiles blake3's NEON C file, which needs a C
# compiler and the macOS SDK, so the crate could not be checked from Windows. Drop `pure` on a
# Mac with Xcode's tools for NEON hashing.
blake3 = { version = "1", features = ["pure"] }
libc = "=0.2.191"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
